<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#00394b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>CatchPilot Test</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#001f2b;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}button{font:inherit}.app{height:100%;max-width:500px;margin:auto;background:#00394b;position:relative;overflow:hidden}.screen{position:absolute;inset:0;display:none;background:#00394b}.screen.on{display:flex;align-items:center;justify-content:center}.shot{width:100%;height:100%;object-fit:fill;display:block}.tap{position:absolute;background:transparent;border:0;color:transparent;z-index:5}.bottom{bottom:0;height:9%;width:20%}.b1{left:0}.b2{left:20%}.b3{left:40%}.b4{left:60%}.b5{left:80%}.bite{left:27%;right:27%;bottom:12%;height:19%;border-radius:50%}.save{left:7%;right:7%;bottom:4%;height:9%}.speciesTap{left:3%;right:3%;top:10%;height:30%}.mapnav{right:3%;top:11%;width:18%;height:12%}.back{left:0;top:3%;width:18%;height:12%}.toast{position:absolute;left:8%;right:8%;bottom:12%;background:rgba(0,25,35,.95);border:1px solid #4d7785;border-radius:14px;padding:12px;text-align:center;z-index:20;display:none}.toast.on{display:block}.navscreen{padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:none!important;flex-direction:column;background:linear-gradient(#075777,#00384c 60%,#002b3b)}.navscreen.on{display:flex!important}.navtop{text-align:center;font-weight:800;font-size:20px;padding:10px}.compass{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.75);margin:30px auto 12px;display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.12))}.arrow{font-size:110px;transform:rotate(247deg)}.bearing{text-align:center;font-size:38px;font-weight:900}.sub{text-align:center;color:#c8dde5}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.card{background:#f5f7f8;color:#18303a;border-radius:13px;padding:13px}.card small{display:block;color:#5d717a}.card b{font-size:23px}.warn{font-size:12px;text-align:center;color:#c6d7dd;margin-top:auto}.navback{position:absolute;left:12px;top:max(14px,env(safe-area-inset-top));border:0;background:transparent;color:white;font-size:32px;z-index:3}.gps{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;font-size:11px;background:#0d8f38;padding:5px 8px;border-radius:20px}.lang{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;z-index:10;border:1px solid rgba(255,255,255,.6);background:rgba(0,38,52,.75);color:white;border-radius:18px;padding:7px 10px}.overlayBite{position:absolute;left:27%;right:27%;bottom:11%;height:18%;display:none;align-items:center;justify-content:center;font-size:36px;font-weight:950;pointer-events:none}.en .overlayBite{display:flex}.en #homeImg{filter:none}
</style></head><body><main class="app" id="app">
<button class="lang" id="lang">SV</button>
<section class="screen on" id="home"><img id="homeImg" class="shot" src="assets/home.webp" alt="NAPP startsida"><div class="overlayBite">BITE!</div><button class="tap bite napp-button" id="nappButton" type="button" aria-label="Registrera napp"></button>
<button id="continueButton" type="button" hidden>FORTSÄTT</button>
<button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen" id="register"><img class="shot" src="assets/register.webp" alt="Registrera fångst"><button class="tap back" data-go="home"></button><button class="tap speciesTap" data-go="species"></button><button class="tap save" id="saveCatch"></button></section>
<section class="screen" id="map"><img class="shot" src="assets/map.webp" alt="Fiskekarta"><button class="tap mapnav" data-go="navigate"></button><button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen" id="species"><img class="shot" src="assets/species.webp" alt="Välj fiskart"><button class="tap back" data-go="register"></button><button class="tap" style="left:0;right:0;top:17%;height:13%" data-go="register"></button></section>
<section class="screen" id="catches"><img class="shot" src="assets/catches.webp" alt="Mina fångster"><button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen" id="stats"><img class="shot" src="assets/stats.webp" alt="Statistik"><button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen" id="gear"><img class="shot" src="assets/gear.webp" alt="Utrustning"><button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen" id="weather"><img class="shot" src="assets/weather.webp" alt="Väder och fiskeindex"><button class="tap bottom b1" data-go="home"></button><button class="tap bottom b2" data-go="map"></button><button class="tap bottom b3" data-go="catches"></button><button class="tap bottom b4" data-go="gear"></button><button class="tap bottom b5" data-go="weather"></button></section>
<section class="screen navscreen" id="navigate"><button class="navback" data-go="map">‹</button><span class="gps">● GPS DEMO</span><div class="navtop">Navigera till hotspot</div><div class="compass"><div class="arrow">↑</div></div><div class="bearing">247°</div><div class="sub">Bäring till privat hotspot 🔒</div><div class="cards"><div class="card"><small>Avstånd</small><b>1,8 NM</b></div><div class="card"><small>ETA</small><b>12 min</b></div><div class="card"><small>Fart</small><b>9,0 kn</b></div><div class="card"><small>Noggrannhet</small><b>± 8 m</b></div></div><p class="warn">Rak bäring är inte en säker båtrutt. Kontrollera sjökort, grund och farleder.</p></section>
<div class="toast" id="toast">✓ Fångsten sparades i testversionen</div>
</main><script>(()=>{const app=document.getElementById('app'),screens=[...app.querySelectorAll('.screen')],toast=document.getElementById('toast');function show(id){screens.forEach(s=>s.classList.toggle('on',s.id===id));toast.classList.remove('on')}app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));document.getElementById('saveCatch').addEventListener('click',()=>{show('catches');toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)});document.getElementById('lang').addEventListener('click',e=>{const en=app.classList.toggle('en');e.currentTarget.textContent=en?'EN':'SV'});})();</script>



<style>
@keyframes nappPulse {
  0%, 100% {
    transform: scale(0.96);
    filter: brightness(1.1);
  }
  50% {
    transform: scale(1.04);
    filter: brightness(1.65);
  }
}

.napp-pulsing {
  animation: nappPulse 1.2s ease-in-out infinite;
  border-radius: 50%;
  box-shadow:
    inset 0 8px 18px rgba(0,0,0,0.5),
    0 0 25px rgba(255,30,30,0.6);
}
  
.napp-button {
  border-radius: 50%;
  background: transparent;
  transition: transform 0.2s, filter 0.2s;
}

.napp-button.napp-pulsing {
  animation: nappPulse 1.2s ease-in-out infinite;
background: transparent;
  box-shadow:
    inset 0 10px 20px rgba(0, 0, 0, 0.65),
inset 0 0 18px rgba(255, 30, 30, 0.7);
}


#continueButton {
  position: absolute;
  left: 50%;
  bottom: 10%;
  transform: translateX(-50%);
  background: linear-gradient(#25d65a, #087b29);
  color: white;
  border: 2px solid #075c22;
  border-radius: 10px;
  padding: 14px 35px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  z-index: 20;
}

#continueButton[hidden] {
  display: none;
}


</style>





<script>
const nappKnapp = document.getElementById('nappButton');
const fortsattKnapp = document.getElementById('continueButton');

if (nappKnapp && fortsattKnapp) {
  let nappAktivt = false;

  nappKnapp.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();

    nappAktivt = !nappAktivt;

    nappKnapp.classList.toggle('napp-pulsing', nappAktivt);
    nappKnapp.setAttribute('aria-pressed', String(nappAktivt));
    fortsattKnapp.hidden = !nappAktivt;
  });

  fortsattKnapp.addEventListener('click', function(event) {
    event.preventDefault();
    event.stopPropagation();

    if (!nappAktivt) return;

    nappAktivt = false;
    nappKnapp.classList.remove('napp-pulsing');
    nappKnapp.setAttribute('aria-pressed', 'false');
    fortsattKnapp.hidden = true;

    document.querySelectorAll('.screen').forEach(s => {
      s.classList.toggle('on', s.id === 'register');
    });
  });
}
</script>


</body></html>
